<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="dsh-calibration-tier 同框五模式演示：思考 / 循环 / 对抗 / 检索 / 代理；检索与代理各是一个轮换格，排在选项条末尾且恒亮">
  <defs>
    <style>
      .title { font: 600 18px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif; fill: #e8e8ef; }
      .sub { font: 400 12px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif; fill: #9aa0b4; }
      .cell { font: 500 12px/1 "Segoe UI", "Microsoft YaHei", sans-serif; fill: #c9c9d6; }
      .on { fill: #ffffff; font-weight: 600; }
      .foot { font: 400 11px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif; fill: #8f94a8; }
    </style>
  </defs>
  <rect width="760" height="400" fill="#14151c"/>
  <text class="title" x="32" y="40">dsh-calibration-tier · 同框五模式</text>
  <text class="sub" x="32" y="62">思考 ⇄ 循环 互斥切换；「对抗」可叠加；检索与代理各一格，排在最后，点一下走一档</text>
  <text class="sub" x="32" y="110">思考</text>
    <rect x="84" y="92" width="62" height="28" rx="14" fill="none" stroke="#877be3" stroke-opacity=".45"
/>
    <text class="cell" x="115" y="110" text-anchor="middle">常规</text>
    <rect x="150" y="92" width="62" height="28" rx="14" fill="#877be3"
/>
    <text class="cell on" x="181" y="110" text-anchor="middle">严格</text>
    <rect x="216" y="92" width="62" height="28" rx="14" fill="none" stroke="#877be3" stroke-opacity=".45"
/>
    <text class="cell" x="247" y="110" text-anchor="middle">极致</text>
    <rect x="290" y="97" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="298" y="92" width="62" height="28" rx="14" fill="none" stroke="#66ae7c" stroke-opacity=".45"
/>
    <text class="cell" x="329" y="110" text-anchor="middle">循环</text>
    <rect x="372" y="97" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="380" y="92" width="62" height="28" rx="14" fill="none" stroke="#da7f7f" stroke-opacity=".45"
/>
    <text class="cell" x="411" y="110" text-anchor="middle">对抗</text>
    <rect x="454" y="97" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="462" y="92" width="62" height="28" rx="14" fill="#3a9ad9"
/>
    <text class="cell on" x="493" y="110" text-anchor="middle">本地</text>
    <rect x="536" y="97" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="544" y="92" width="62" height="28" rx="14" fill="#24543f"
/>
    <text class="cell on" x="575" y="110" text-anchor="middle">默认</text>
  <text class="sub" x="32" y="166">循环+对抗</text>
    <rect x="84" y="148" width="62" height="28" rx="14" fill="none" stroke="#cf8a4a" stroke-opacity=".45"
/>
    <text class="cell" x="115" y="166" text-anchor="middle">轻量</text>
    <rect x="150" y="148" width="62" height="28" rx="14" fill="#cf8a4a"
/>
    <text class="cell on" x="181" y="166" text-anchor="middle">交付</text>
    <rect x="216" y="148" width="62" height="28" rx="14" fill="none" stroke="#cf8a4a" stroke-opacity=".45"
/>
    <text class="cell" x="247" y="166" text-anchor="middle">极致</text>
    <rect x="290" y="153" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="298" y="148" width="62" height="28" rx="14" fill="#66ae7c"
/>
    <text class="cell on" x="329" y="166" text-anchor="middle">循环</text>
    <rect x="372" y="153" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="380" y="148" width="62" height="28" rx="14" fill="#da7f7f"
/>
    <text class="cell on" x="411" y="166" text-anchor="middle">对抗</text>
    <rect x="454" y="153" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="462" y="148" width="62" height="28" rx="14" fill="#3a9ad9"
/>
    <text class="cell on" x="493" y="166" text-anchor="middle">本地</text>
    <rect x="536" y="153" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="544" y="148" width="62" height="28" rx="14" fill="#24543f"
/>
    <text class="cell on" x="575" y="166" text-anchor="middle">默认</text>
  <text class="sub" x="32" y="222">检索·全量</text>
    <rect x="84" y="204" width="62" height="28" rx="14" fill="none" stroke="#877be3" stroke-opacity=".45"
/>
    <text class="cell" x="115" y="222" text-anchor="middle">常规</text>
    <rect x="150" y="204" width="62" height="28" rx="14" fill="#877be3"
/>
    <text class="cell on" x="181" y="222" text-anchor="middle">严格</text>
    <rect x="216" y="204" width="62" height="28" rx="14" fill="none" stroke="#877be3" stroke-opacity=".45"
/>
    <text class="cell" x="247" y="222" text-anchor="middle">极致</text>
    <rect x="290" y="209" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="298" y="204" width="62" height="28" rx="14" fill="none" stroke="#66ae7c" stroke-opacity=".45"
/>
    <text class="cell" x="329" y="222" text-anchor="middle">循环</text>
    <rect x="372" y="209" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="380" y="204" width="62" height="28" rx="14" fill="none" stroke="#da7f7f" stroke-opacity=".45"
/>
    <text class="cell" x="411" y="222" text-anchor="middle">对抗</text>
    <rect x="454" y="209" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="462" y="204" width="62" height="28" rx="14" fill="#3a9ad9"
/>
    <text class="cell on" x="493" y="222" text-anchor="middle">全量</text>
    <rect x="536" y="209" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="544" y="204" width="62" height="28" rx="14" fill="#24543f"
/>
    <text class="cell on" x="575" y="222" text-anchor="middle">默认</text>
  <text class="sub" x="32" y="278">代理·性能</text>
    <rect x="84" y="260" width="62" height="28" rx="14" fill="none" stroke="#877be3" stroke-opacity=".45"
/>
    <text class="cell" x="115" y="278" text-anchor="middle">常规</text>
    <rect x="150" y="260" width="62" height="28" rx="14" fill="#877be3"
/>
    <text class="cell on" x="181" y="278" text-anchor="middle">严格</text>
    <rect x="216" y="260" width="62" height="28" rx="14" fill="none" stroke="#877be3" stroke-opacity=".45"
/>
    <text class="cell" x="247" y="278" text-anchor="middle">极致</text>
    <rect x="290" y="265" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="298" y="260" width="62" height="28" rx="14" fill="none" stroke="#66ae7c" stroke-opacity=".45"
/>
    <text class="cell" x="329" y="278" text-anchor="middle">循环</text>
    <rect x="372" y="265" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="380" y="260" width="62" height="28" rx="14" fill="none" stroke="#da7f7f" stroke-opacity=".45"
/>
    <text class="cell" x="411" y="278" text-anchor="middle">对抗</text>
    <rect x="454" y="265" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="462" y="260" width="62" height="28" rx="14" fill="#3a9ad9"
/>
    <text class="cell on" x="493" y="278" text-anchor="middle">本地</text>
    <rect x="536" y="265" width="1" height="18" fill="#7f7f8a" fill-opacity=".38"/>
    <rect x="544" y="260" width="62" height="28" rx="14" fill="#24543f"
/>
    <text class="cell on" x="575" y="278" text-anchor="middle">性能</text>

  <text class="foot" x="32" y="330">常规 / 严格 / 极致 = 问多深   ·   轻量 / 交付 / 极致 = 磨几轮（3 / 5 / 8）   ·   本地 / 增量 / 全量 = 找多宽   ·   默认 / 效率 / 性能 = 派谁</text>
  <text class="foot" x="32" y="354">检索格：本地 → 增量 → 全量 → 本地；代理格：默认 → 效率 → 性能 → 默认（v3.5.0 各一格，排在选项条末尾）</text>
  <text class="foot" x="32" y="378">两格恒亮：本地也天蓝 #3a9ad9、默认也墨绿 #24543f；循环 + 对抗 同开时等级格转橙 #cf8a4a</text>
</svg>
